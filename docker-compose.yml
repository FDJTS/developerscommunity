version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: devcom-postgres
    environment:
      POSTGRES_USER: devcom
      POSTGRES_PASSWORD: devcom_password
      POSTGRES_DB: devcom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcom"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devcom-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://devcom:devcom_password@postgres:5432/devcom
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
